---
name: CI
permissions:
  contents: write

'on':
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev netcat-openbsd make curl

      - name: Verify formatting
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "Unformatted files found:"
            echo "$diff"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Generate coverage
        run: make coverage

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: $COVERAGE%"
          COLOR=$(awk -v val="$COVERAGE" 'BEGIN { if (val >= 80) print "brightgreen"; else if (val >= 70) print "green"; else if (val >= 50) print "yellow"; else print "red" }')
          curl -s "https://img.shields.io/badge/coverage-${COVERAGE}%25-${COLOR}" > coverage.svg

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update coverage badge"
          file_pattern: coverage.svg

  docker-build-and-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for testing
        run: |
          make docker-build

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd make

      - name: Run Docker E2E Test
        env:
          SKIP_DOCKER_BUILD: "1"
        run: |
          chmod +x tests/e2e_docker.sh
          ./tests/e2e_docker.sh

      - name: Run Docker Periodic E2E Test
        env:
          SKIP_DOCKER_BUILD: "1"
        run: |
          chmod +x tests/e2e_periodic_docker.sh
          ./tests/e2e_periodic_docker.sh
