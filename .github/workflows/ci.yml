---
name: CI/CD

permissions:
  contents: read

'on':
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  release:
    types: [published]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev netcat-openbsd make curl

      - name: Verify module dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify formatting
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "Unformatted files found:"
            echo "$diff"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Generate coverage
        run: make coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html

  docker-build-and-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image for testing
        run: |
          make docker-build

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: syslog_sniffer:latest
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd make

      - name: Run Docker E2E Test
        env:
          SKIP_DOCKER_BUILD: "1"
        run: |
          chmod +x tests/e2e_docker.sh
          ./tests/e2e_docker.sh

      - name: Run Docker Periodic E2E Test
        env:
          SKIP_DOCKER_BUILD: "1"
        run: |
          chmod +x tests/e2e_periodic_docker.sh
          ./tests/e2e_periodic_docker.sh

  build-release-binaries:
    name: Build Multi-Arch Release Binaries
    needs: docker-build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract version
        id: version
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$file_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be SemVer without v-prefix (example: 1.2.3)"
            exit 1
          fi
          echo "version=$file_version" >> "$GITHUB_OUTPUT"

      - name: Build binaries via Buildx
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist

          for arch in amd64 arm64; do
            echo "Building linux/$arch..."
            mkdir -p "dist/syslog_sniffer_${VERSION}_linux_${arch}"
            docker buildx build \
              --platform "linux/${arch}" \
              --build-arg "VERSION=${VERSION}" \
              --target artifacts \
              --output "type=local,dest=dist/syslog_sniffer_${VERSION}_linux_${arch}" .

            tar -C "dist/syslog_sniffer_${VERSION}_linux_${arch}" -czf "dist/syslog_sniffer_${VERSION}_linux_${arch}.tar.gz" syslog_sniffer
            rm -rf "dist/syslog_sniffer_${VERSION}_linux_${arch}"
          done

          cd dist
          sha256sum syslog_sniffer_*.tar.gz > checksums.txt
          cd ..
          ls -la dist/

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifacts
          path: dist/*

  draft-release:
    name: Create Draft Release
    needs: build-release-binaries
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check if VERSION changed
        id: version
        run: |
          changed="false"
          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          BASE_REF="${{ github.event.before }}"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD~1"
          fi
          PREVIOUS_VERSION="$(git show "${BASE_REF}:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"

          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREVIOUS_VERSION"

          if [ -n "$PREVIOUS_VERSION" ] && [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            changed="true"
          elif [ -z "$PREVIOUS_VERSION" ]; then
            changed="true"
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        if: steps.version.outputs.changed == 'true' || github.event_name == 'release'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-artifacts
          path: release_assets

      - name: Create or update draft release
        if: steps.version.outputs.changed == 'true' || github.event_name == 'release'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "Release v${{ steps.version.outputs.version }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Build & Publish Multi-Arch Container
    needs: draft-release
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version
        id: version
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$file_version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }},enable=${{ github.event_name == 'release' || needs.draft-release.outputs.version_changed == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }},enable=${{ github.event_name == 'release' || needs.draft-release.outputs.version_changed == 'true' }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }},enable=${{ github.event_name == 'release' || needs.draft-release.outputs.version_changed == 'true' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name == 'release' || needs.draft-release.outputs.version_changed == 'true' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || needs.draft-release.outputs.version_changed == 'true' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'release' && needs.draft-release.outputs.version_changed != 'true' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'release' && needs.draft-release.outputs.version_changed != 'true' }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
